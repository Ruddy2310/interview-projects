<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PeopleHub — Employee Directory</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#14161f;--mute:#667085;--line:#e4e7ee;--acc:#4f46e5;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--soft:#eef0ff}
@media(prefers-color-scheme:dark){:root{--bg:#0f1117;--card:#181b24;--ink:#eceef5;--mute:#98a2b3;--line:#2a2f3c;--soft:#22264a}}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,"Segoe UI",sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:24px 20px}h1{font-size:26px}.sub{color:var(--mute)}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);width:100%}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--acc);color:#fff;font-weight:600}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.grid{display:grid;gap:14px}
.pill{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--acc);font-weight:600;display:inline-block}
label{font-size:13px;color:var(--mute);display:block;margin-bottom:4px}
@media(max-width:700px){.wrap{padding:16px 14px}}
.stats{grid-template-columns:repeat(3,1fr);margin:18px 0}.stats b{font-size:28px;display:block}.bar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:16px}
.cards{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;margin-bottom:10px}
.cards .card{cursor:pointer;transition:.2s}.cards .card:hover{transform:translateY(-3px);border-color:var(--acc)}
dialog{border:0;border-radius:18px;padding:24px;max-width:380px;width:92%;background:var(--card);color:var(--ink)}dialog::backdrop{background:#0008}
.st-Active{color:var(--ok)}.st-Remote{color:var(--acc)}.st-Leave{color:var(--warn)}
@media(max-width:700px){.bar{grid-template-columns:1fr}}</style></head><body>
<div class="wrap"><h1>👥 PeopleHub</h1><p class="sub">Employee directory · search, filter, sort</p>
<div class="grid stats" id="st"></div>
<div class="bar"><input id="q" placeholder="Search name, role or city"><select id="d"></select><select id="s"><option value="n">Sort: Name</option><option value="r">Sort: Role</option><option value="c">Sort: City</option></select></div>
<div class="grid cards" id="g"></div><p class="sub" id="none" hidden>No employees match your search.</p></div>
<dialog id="m"></dialog>
<script>
var P="Aarav Mehta|Engineering|Frontend Developer|Rajkot|Active|aarav@peoplehub.demo;Diya Patel|Design|UI Designer|Ahmedabad|Remote|diya@peoplehub.demo;Kabir Shah|Engineering|Backend Developer|Rajkot|Active|kabir@peoplehub.demo;Ishita Joshi|HR|HR Manager|Surat|Active|ishita@peoplehub.demo;Rohan Desai|Sales|Sales Executive|Vadodara|On Leave|rohan@peoplehub.demo;Meera Trivedi|Design|UX Researcher|Rajkot|Active|meera@peoplehub.demo;Vivaan Gohil|Support|Support Lead|Bhuj|Active|vivaan@peoplehub.demo;Anaya Parmar|Engineering|QA Engineer|Rajkot|Remote|anaya@peoplehub.demo;Dev Solanki|Sales|Account Manager|Surat|Active|dev@peoplehub.demo;Riya Vyas|HR|Recruiter|Ahmedabad|On Leave|riya@peoplehub.demo;Arjun Bhatt|Engineering|WordPress Developer|Rajkot|Active|arjun@peoplehub.demo;Kiara Dave|Support|Support Agent|Rajkot|Active|kiara@peoplehub.demo;Yash Raval|Design|Graphic Designer|Vadodara|Remote|yash@peoplehub.demo;Nisha Kothari|Sales|Sales Manager|Ahmedabad|Active|nisha@peoplehub.demo";
var E=P.split(";").map(function(x){var a=x.split("|");return{n:a[0],d:a[1],r:a[2],c:a[3],s:a[4],e:a[5]}});
var q=document.getElementById("q"),d=document.getElementById("d"),s=document.getElementById("s"),g=document.getElementById("g"),m=document.getElementById("m");
var depts=["All departments"].concat(E.map(function(e){return e.d}).filter(function(v,i,a){return a.indexOf(v)==i}));
d.innerHTML=depts.map(function(x,i){return'<option value="'+(i?x:"")+'">'+x+"</option>"}).join("");
function col(n){var h=0;for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%360;return"hsl("+h+",55%,45%)"}
function ini(n){return n.split(" ").map(function(w){return w[0]}).join("")}
function cls(s){return"st-"+s.split(" ")[0]}
function draw(){
  var t=q.value.toLowerCase(),k=s.value;
  var L=E.filter(function(e){return(!d.value||e.d==d.value)&&(e.n+e.r+e.c).toLowerCase().indexOf(t)>-1});
  L.sort(function(a,b){return a[k].localeCompare(b[k])});
  g.innerHTML=L.map(function(e){return'<div class="card" data-i="'+E.indexOf(e)+'"><div class="av" style="background:'+col(e.n)+'">'+ini(e.n)+'</div><b>'+e.n+'</b><div class="sub">'+e.r+'</div><div style="margin:8px 0"><span class="pill">'+e.d+'</span></div><small class="'+cls(e.s)+'">● '+e.s+' · '+e.c+'</small></div>'}).join("");
  document.getElementById("none").hidden=L.length>0;
  document.getElementById("st").innerHTML=[["Showing",L.length],["Departments",depts.length-1],["On leave",L.filter(function(e){return e.s=="On Leave"}).length]].map(function(x){return'<div class="card"><b>'+x[1]+'</b><span class="sub">'+x[0]+"</span></div>"}).join("");
}
[q,d,s].forEach(function(el){el.addEventListener("input",draw)});
g.addEventListener("click",function(ev){var c=ev.target.closest("[data-i]");if(!c)return;var e=E[c.dataset.i];
  m.innerHTML='<div class="av" style="background:'+col(e.n)+'">'+ini(e.n)+'</div><h2>'+e.n+'</h2><p class="sub">'+e.r+' · '+e.d+'</p><p style="margin:12px 0">📍 '+e.c+'<br>✉ '+e.e+'<br><span class="'+cls(e.s)+'">● '+e.s+'</span></p><button onclick="m.close()">Close</button>';m.showModal()});
m.addEventListener("click",function(ev){if(ev.target==m)m.close()});
draw();
</script></body></html>
