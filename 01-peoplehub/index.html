<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PeopleHub | Who’s who at Northwind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#15332A;--ink:#F3F0E7;--mute:#A6BBB0;--line:#2E5547;
--serif:"Instrument Serif",Georgia,serif;--sans:"Onest","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid #F2C94C;outline-offset:3px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px 90px}
.top{display:flex;justify-content:space-between;align-items:center;padding:24px 0}
.brand{display:flex;align-items:center;gap:12px;font:400 1.7rem var(--serif)}
.brand svg{width:30px;height:30px;border-radius:7px}
.top span{color:var(--mute);font-size:.95rem}
h1{font:400 clamp(3.2rem,10vw,8rem)/.92 var(--serif);letter-spacing:-.03em;margin:46px 0 18px;max-width:9em}
.count{color:var(--mute);font-size:1.15rem;margin-bottom:44px}
.bar{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-end;margin-bottom:22px}
.search{flex:1 1 320px}
.search input{width:100%;background:none;border:0;border-bottom:2px solid var(--line);padding:12px 0;font-size:1.5rem;font-family:var(--serif);outline-offset:6px}
.search input::placeholder{color:#6F8A7D}
.search input:focus{border-color:var(--ink)}
.seg{display:flex;gap:4px}
.seg span{color:var(--mute);align-self:center;margin-right:8px;font-size:.92rem}
.seg button,.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:8px 18px;cursor:pointer;font-weight:500;color:var(--mute)}
.seg button:hover,.chip:hover{color:var(--ink);border-color:var(--ink)}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:54px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:40px 24px}
.tile{display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;padding:0}
.tile svg{width:100%;aspect-ratio:1;display:block;border-radius:14px;transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.tile:hover svg,.tile:focus-visible svg{transform:rotate(-2.5deg) scale(1.03)}
.tile h2{font:400 1.75rem/1.1 var(--serif);margin:14px 0 2px}
.tile p{font-size:.97rem}
.tile small{color:var(--mute);font-size:.9rem}
.go .tile{animation:in .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--n)*45ms)}
@keyframes in{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.empty{grid-column:1/-1;padding:60px 0}
.empty b{display:block;font:400 2.6rem var(--serif);margin-bottom:6px}
.empty button{margin-top:18px}
dialog{border:0;padding:0;background:transparent;max-width:none;overflow:visible;margin:auto}
dialog::backdrop{background:rgba(8,20,16,.78)}
.badge{width:min(340px,86vw);background:var(--ink);color:#15332A;border-radius:22px;padding:38px 18px 20px;position:relative;transition:transform .18s ease-out;box-shadow:0 40px 80px -20px rgba(0,0,0,.6)}
.badge:before{content:"";position:absolute;top:13px;left:50%;width:70px;height:12px;border-radius:99px;background:#15332A;transform:translateX(-50%)}
.badge .av{width:100%;aspect-ratio:1;border-radius:12px;display:block}
.badge h2{font:400 2.4rem/1 var(--serif);margin:18px 0 4px}
.badge .role{color:#456055;margin-bottom:16px}
.badge dl div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid #C9C6B8;font-size:.95rem}
.badge dt{color:#5A7367}.badge dd{font-weight:500;text-align:right}
.badge a{color:inherit}
.badge .code{margin-top:14px}
.badge .code svg{width:100%;height:42px;display:block}
.close{display:block;margin:18px auto 0;border:1px solid #5E7D6F;background:none;color:var(--ink);border-radius:999px;padding:9px 26px;cursor:pointer;font-weight:500}
.close:hover{background:var(--ink);color:var(--bg)}
@media(max-width:640px){.wrap{padding:0 18px 70px}.top span{display:none}.grid{grid-template-columns:repeat(2,1fr);gap:30px 14px}.tile h2{font-size:1.4rem}}
@media(prefers-reduced-motion:reduce){.go .tile{animation:none}.tile svg,.badge{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 100 100" aria-hidden="true"><rect width="50" height="50" fill="#F26B4F"/><circle cx="75" cy="25" r="25" fill="#F2C94C"/><path d="M0 100V50A50 50 0 0 1 50 100Z" fill="#8EC5E8"/><rect x="50" y="50" width="50" height="50" fill="#C3A9F2"/></svg>
      PeopleHub
    </div>
    <span>Northwind Pvt. Ltd., Rajkot</span>
  </header>

  <h1>Who’s who at Northwind.</h1>
  <p class="count" id="count" aria-live="polite"></p>

  <div class="bar">
    <div class="search"><input id="q" type="search" placeholder="Type a name, role or city" aria-label="Search people" autocomplete="off"></div>
    <div class="seg" role="group" aria-label="Sort by"><span>Sort by</span>
      <button data-s="name" aria-pressed="true">Name</button><button data-s="role" aria-pressed="false">Role</button><button data-s="city" aria-pressed="false">City</button>
    </div>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Filter by city"></div>
  <main class="grid go" id="grid"></main>
</div>
<dialog id="dlg" aria-label="Employee badge"></dialog>

<script>
var P=[["Aarav Mehta","Frontend Engineer","Rajkot"],["Diya Patel","Product Designer","Ahmedabad"],["Kabir Shah","Engineering Manager","Pune"],["Ananya Iyer","Product Manager","Bengaluru"],["Rohan Joshi","Backend Engineer","Rajkot"],["Meera Desai","HR Business Partner","Surat"],["Vivaan Kapoor","Account Executive","Mumbai"],["Isha Trivedi","Brand Designer","Vadodara"],["Arjun Nair","Financial Analyst","Kochi"],["Saanvi Rao","QA Engineer","Hyderabad"],["Yash Bhatt","Sales Lead","Ahmedabad"],["Tara Menon","Recruiter","Bengaluru"],["Dev Chauhan","Data Analyst","Rajkot"],["Nisha Verma","Payroll Specialist","Delhi"],["Karan Malhotra","DevOps Engineer","Pune"],["Riya Sharma","UX Researcher","Mumbai"],["Harsh Vyas","Support Lead","Rajkot"],["Pooja Kulkarni","Content Writer","Pune"]]
.map(function(r){var n=r[0].toLowerCase().split(" ");return{name:r[0],role:r[1],city:r[2],email:n[0]+"."+n[1]+"@northwind.in"}});
var COL=["#F26B4F","#F2C94C","#8EC5E8","#C3A9F2"];
var st={q:"",city:"All",sort:"name"},first=true;
var $=function(i){return document.getElementById(i)};

function rng(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}
  return function(){h+=0x6D2B79F5;var t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function quarter(x,y,o){var a=[[x,y,x+50,y,x,y+50,1],[x+50,y,x,y,x+50,y+50,0],[x+50,y+50,x+50,y,x,y+50,0],[x,y+50,x,y,x+50,y+50,1]][o];
  return'M'+a[0]+','+a[1]+'L'+a[2]+','+a[3]+'A50,50 0 0 '+a[6]+' '+a[4]+','+a[5]+'Z'}
function avatar(name,cls){
  var r=rng(name),g="";
  for(var i=0;i<4;i++){
    var x=(i%2)*50,y=Math.floor(i/2)*50,b=Math.floor(r()*4),f=(b+1+Math.floor(r()*3))%4,t=Math.floor(r()*5),o=Math.floor(r()*4);
    g+='<rect x="'+x+'" y="'+y+'" width="50" height="50" fill="'+COL[b]+'"/>';
    if(t===0)g+='<circle cx="'+(x+25)+'" cy="'+(y+25)+'" r="25" fill="'+COL[f]+'"/>';
    else if(t===1)g+='<rect x="'+(x+9)+'" y="'+(y+9)+'" width="32" height="32" fill="'+COL[f]+'"/>';
    else if(t<4)g+='<path d="'+quarter(x,y,o)+'" fill="'+COL[f]+'"/>';
    else g+='<circle cx="'+(x+25)+'" cy="'+(y+25)+'" r="10" fill="'+COL[f]+'"/>';
  }
  return'<svg class="'+(cls||"")+'" viewBox="0 0 100 100" role="img" aria-label="Generated avatar for '+name+'">'+g+'</svg>'}
function barcode(name){var r=rng(name+"|b"),x=0,s="";
  for(var i=0;i<38;i++){var w=1+Math.floor(r()*3);if(i%2===0)s+='<rect x="'+x+'" y="0" width="'+w+'" height="42" fill="#15332A"/>';x+=w+(i%2?0:.6)}
  return'<svg viewBox="0 0 '+Math.ceil(x)+' 42" preserveAspectRatio="none" aria-hidden="true">'+s+'</svg>'}
function empNo(name){var h=0;for(var i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))%9000;return"NW-"+(1000+h)}

function list(){
  var q=st.q.trim().toLowerCase();
  return P.filter(function(p){return(st.city==="All"||p.city===st.city)&&(!q||(p.name+" "+p.role+" "+p.city).toLowerCase().indexOf(q)>-1)})
   .sort(function(a,b){return a[st.sort].localeCompare(b[st.sort])||a.name.localeCompare(b.name)})}
function cities(){var c={};P.forEach(function(p){c[p.city]=1});return["All"].concat(Object.keys(c).sort())}
function drawChips(){$("chips").innerHTML=cities().map(function(c){return'<button class="chip" data-c="'+c+'" aria-pressed="'+(st.city===c)+'">'+c+'</button>'}).join("")}
function draw(){
  var r=list();
  $("count").textContent=r.length===P.length?P.length+" people in "+(cities().length-1)+" cities. Tap anyone for their badge.":r.length+" of "+P.length+" people match.";
  $("grid").innerHTML=r.length?r.map(function(p,i){
    return'<button class="tile" style="--n:'+i+'" data-i="'+P.indexOf(p)+'">'+avatar(p.name)+'<h2>'+p.name+'</h2><p>'+p.role+'</p><small>'+p.city+'</small></button>'}).join("")
   :'<div class="empty"><b>Nobody by that name.</b>Try fewer letters, or another city.<br><button class="chip" id="clr">Clear filters</button></div>';
  if(first){first=false}else{$("grid").classList.remove("go")}
  var c=$("clr");if(c)c.onclick=function(){st.q="";st.city="All";$("q").value="";drawChips();draw()}}

var still=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
function open(i){var p=P[i];
  $("dlg").innerHTML='<div class="badge" id="bd">'+avatar(p.name,"av")+'<h2>'+p.name+'</h2><div class="role">'+p.role+'</div><dl>'
   +'<div><dt>Office</dt><dd>'+p.city+'</dd></div><div><dt>Email</dt><dd><a href="mailto:'+p.email+'">'+p.email+'</a></dd></div><div><dt>Staff no.</dt><dd>'+empNo(p.name)+'</dd></div></dl>'
   +'<div class="code">'+barcode(p.name)+'</div></div><button class="close" id="cl">Close</button>';
  $("dlg").showModal();
  var b=$("bd");
  if(!still){b.onpointermove=function(e){var r=b.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
    b.style.transform="perspective(900px) rotateY("+x*16+"deg) rotateX("+-y*16+"deg)"};
    b.onpointerleave=function(){b.style.transform=""}}
  $("cl").onclick=function(){$("dlg").close()}}

$("q").oninput=function(){st.q=this.value;draw()};
document.querySelector(".seg").onclick=function(e){var b=e.target.closest("button");if(!b)return;st.sort=b.dataset.s;
  this.querySelectorAll("button").forEach(function(x){x.setAttribute("aria-pressed",x===b)});draw()};
$("chips").onclick=function(e){var b=e.target.closest(".chip");if(!b)return;st.city=b.dataset.c;drawChips();draw()};
$("grid").onclick=function(e){var b=e.target.closest(".tile");if(b)open(+b.dataset.i)};
$("dlg").onclick=function(e){if(e.target===this)this.close()};
document.addEventListener("keydown",function(e){if(e.key==="/"&&document.activeElement.tagName!=="INPUT"&&!$("dlg").open){e.preventDefault();$("q").focus()}});
drawChips();draw();
</script>
</body>
</html>
