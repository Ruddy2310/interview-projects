<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salary & Payslip Calculator</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#14161f;--mute:#667085;--line:#e4e7ee;--acc:#4f46e5;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--soft:#eef0ff}
@media(prefers-color-scheme:dark){:root{--bg:#0f1117;--card:#181b24;--ink:#eceef5;--mute:#98a2b3;--line:#2a2f3c;--soft:#22264a}}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,"Segoe UI",sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:24px 20px}h1{font-size:26px}.sub{color:var(--mute)}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);width:100%}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--acc);color:#fff;font-weight:600}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.grid{display:grid;gap:14px}
.pill{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--acc);font-weight:600;display:inline-block}
label{font-size:13px;color:var(--mute);display:block;margin-bottom:4px}
@media(max-width:700px){.wrap{padding:16px 14px}}
.two{grid-template-columns:1fr 1.3fr;align-items:start;margin-top:18px}.f{display:grid;gap:12px}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.net{font-size:34px;font-weight:700;color:var(--ok)}.stack{display:flex;height:14px;border-radius:9px;overflow:hidden;margin:12px 0}.stack i{display:block}.chk{display:flex;gap:8px;align-items:center}.chk input{width:auto}
.note{font-size:12px;color:var(--mute);margin-top:12px}
@media(max-width:800px){.two{grid-template-columns:1fr}}
@media print{.noprint{display:none}body{background:#fff;color:#000}.card{border:0}}</style></head><body>
<div class="wrap"><h1>💰 Salary & Payslip Calculator</h1><p class="sub">Enter annual CTC to see monthly breakup and an estimated in-hand salary.</p>
<div class="grid two"><div class="card f noprint"><div><label>Annual CTC (₹)</label><input type="number" id="c" value="600000" min="0"></div>
<div><label>Basic salary (% of CTC): <b id="bv">40</b>%</label><input type="range" id="bp" min="30" max="60" value="40"></div>
<label class="chk"><input type="checkbox" id="cap" checked> Cap PF at ₹15,000 wage ceiling (₹1,800/month)</label>
<button onclick="window.print()">🖨 Print payslip</button></div>
<div class="card" id="o"></div></div></div>
<script>
var $=function(i){return document.getElementById(i)};
function inr(n){return"₹"+Math.round(n).toLocaleString("en-IN")}
function calc(){
  var ctc=+$("c").value||0,bp=+$("bp").value;$("bv").textContent=bp;
  var m=ctc/12,basic=m*bp/100,hra=basic*0.5;
  var pf=$("cap").checked?Math.min(basic*0.12,1800):basic*0.12;
  var special=Math.max(0,m-basic-hra-pf),gross=basic+hra+special;
  var pt=gross>12000?200:0,ded=pf+pt,net=gross-ded;
  var rows=[["Basic",basic],["HRA (50% of basic)",hra],["Special allowance",special]];
  var w=function(v){return(gross?v/gross*100:0)+"%"};
  $("o").innerHTML='<span class="sub">Estimated monthly in-hand</span><div class="net">'+inr(net)+'</div>'+
  '<div class="stack"><i style="width:'+w(basic)+';background:#4f46e5"></i><i style="width:'+w(hra)+';background:#16a34a"></i><i style="width:'+w(special)+';background:#d97706"></i></div>'+
  rows.map(function(r){return'<div class="row"><span>'+r[0]+'</span><b>'+inr(r[1])+"</b></div>"}).join("")+
  '<div class="row"><span><b>Gross monthly</b></span><b>'+inr(gross)+'</b></div>'+
  '<div class="row"><span>Employee PF (12% of basic)</span><b>− '+inr(pf)+'</b></div>'+
  '<div class="row"><span>Professional tax (Gujarat, est.)</span><b>− '+inr(pt)+'</b></div>'+
  '<div class="row"><span><b>Net (before income tax)</b></span><b>'+inr(net)+'</b></div>'+
  '<p class="note">Estimate only. Employer PF is part of CTC. Income tax (TDS), bonuses and other deductions are not included.</p>';
}
["c","bp","cap"].forEach(function(i){$(i).addEventListener("input",calc)});calc();
</script></body></html>
