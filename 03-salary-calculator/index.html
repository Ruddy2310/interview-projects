<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salary calculator and payslip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6C945;--ink:#1A1500;--soft:#4E4208;--paper:#FFFDF6;
--disp:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:500 1rem/1.55 var(--disp);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:4px}
.stage{max-width:1180px;margin:0 auto;padding:30px 28px 80px;display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:64px;align-items:start}
.brand{font:700 1.15rem var(--disp);letter-spacing:-.01em;margin-bottom:46px;display:flex;align-items:center;gap:10px}
.brand i{width:22px;height:22px;background:var(--ink);border-radius:50% 50% 50% 0}
h1{font:800 clamp(2.6rem,6vw,5rem)/.96 var(--disp);letter-spacing:-.045em;max-width:9em;margin-bottom:34px}
.net{font:800 clamp(3.6rem,10vw,7.4rem)/1 var(--disp);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.per{font-size:1.2rem;margin:4px 0 14px}
.of{color:var(--soft);max-width:30em;margin-bottom:22px}
.flow{display:flex;height:18px;border-radius:99px;overflow:hidden;border:2px solid var(--ink);background:var(--paper)}
.flow i{display:block;height:100%;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.lg{display:flex;gap:20px;flex-wrap:wrap;margin:12px 0 40px;font-size:.92rem;color:var(--soft)}
.lg s{display:inline-block;width:12px;height:12px;border:2px solid var(--ink);margin-right:7px;border-radius:3px;text-decoration:none;vertical-align:-1px}
form{border-top:3px solid var(--ink);padding-top:26px;display:grid;gap:22px}
.row label{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;margin-bottom:6px}
.row label output{font:600 1rem var(--mono)}
input[type=text],input[type=number],select{width:100%;background:rgba(255,255,255,.35);border:2px solid var(--ink);border-radius:12px;padding:11px 14px}
input[type=range]{width:100%;accent-color:var(--ink);height:28px}
.pre{position:relative}.pre span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-weight:700}.pre input{padding-left:32px}
.chk{display:flex;gap:12px;align-items:flex-start;font-weight:600}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--ink)}
.err{font-weight:700;margin-top:4px}
.hint{color:var(--soft);font-size:.9rem;margin-top:4px}
.rw{position:sticky;top:24px;filter:drop-shadow(0 22px 18px rgba(60,40,0,.32));transform:rotate(1.4deg)}
.receipt{background:var(--paper);padding:38px 30px 44px;font:400 .93rem/1.5 var(--mono);color:#221C06;
 -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/16px 51% repeat-x,conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) top/16px 51% repeat-x;
 mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/16px 51% repeat-x,conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) top/16px 51% repeat-x}
.receipt h2{font:700 1.45rem var(--disp);letter-spacing:-.02em;text-align:center}
.receipt .c{text-align:center;color:#6B6130;font-size:.85rem}
.receipt hr{border:0;border-top:2px dashed #BFB78F;margin:16px 0}
.ln{display:flex;gap:8px;align-items:baseline;padding:3px 0}
.ln i{flex:1;border-bottom:2px dotted #C9C19A;transform:translateY(-4px)}
.ln.b{font-weight:600}
.ln.big{font:800 1.5rem var(--disp);letter-spacing:-.03em;padding-top:4px}
.ln.big i{border-bottom-style:solid;border-color:#221C06}
.fine{font-size:.78rem;color:#6B6130;margin-top:14px;text-align:center}
.prt{display:block;margin:30px auto 0;border:2px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:700;padding:13px 28px;border-radius:999px;cursor:pointer}
.prt:hover{background:none;color:var(--ink)}
@media(max-width:940px){.stage{grid-template-columns:1fr;gap:44px;padding:22px 18px 60px}.rw{position:static;transform:none}.brand{margin-bottom:30px}}
@media print{
  body{background:#fff}.stage{display:block;padding:0;max-width:none}.stage>section:first-child,.prt{display:none!important}
  .rw{position:static;transform:none;filter:none}.receipt{-webkit-mask:none;mask:none;max-width:480px;margin:0 auto;border:2px solid #221C06;padding:30px}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media(prefers-reduced-motion:reduce){.flow i{transition:none}}
</style>
</head>
<body>
<main class="stage">
  <section>
    <div class="brand"><i></i>Northwind Payroll</div>
    <h1>What actually reaches your bank.</h1>
    <div class="net" id="net" aria-live="polite">₹0</div>
    <div class="per">in hand, every month</div>
    <p class="of" id="of"></p>
    <div class="flow" id="flow" role="img" aria-label="Share of gross pay that is take-home, PF and professional tax"></div>
    <div class="lg"><span><s style="background:var(--ink)"></s>In hand</span><span><s style="background:repeating-linear-gradient(45deg,var(--ink) 0 2px,var(--bg) 2px 5px)"></s>Provident fund</span><span><s style="background:#fff"></s>Professional tax</span></div>

    <form id="f" onsubmit="return false" novalidate>
      <div class="row"><label for="ctc">Annual CTC<output id="ctcv"></output></label>
        <div class="pre"><span>₹</span><input type="number" id="ctc" value="600000" min="0" step="10000" inputmode="numeric"></div>
        <input type="range" id="ctcr" min="150000" max="3000000" step="10000" value="600000" aria-label="Annual CTC slider">
        <div class="err" id="e-ctc"></div></div>
      <div class="row"><label for="bp">Basic salary, % of CTC<output id="bpv"></output></label>
        <input type="range" id="bp" min="30" max="60" step="1" value="40"><div class="hint">House rent allowance is taken as 50% of basic.</div></div>
      <label class="chk" for="pf"><input type="checkbox" id="pf" checked>Deduct employee provident fund (12% of basic)</label>
      <label class="chk" for="cap"><input type="checkbox" id="cap" checked>Cap PF at the ₹15,000 wage ceiling (₹1,800 a month)</label>
      <div class="row"><label for="pt">Professional tax</label>
        <select id="pt"><option value="gj">Gujarat slab</option><option value="none">Not applicable</option></select></div>
      <div class="row"><label for="name">Name on payslip</label><input type="text" id="name" value="Rudra Soni"></div>
    </form>
  </section>

  <section>
    <div class="rw"><div class="receipt" id="rc"></div></div>
    <button class="prt" id="pr" type="button">Print payslip</button>
  </section>
</main>

<script>
var $=function(i){return document.getElementById(i)};
var inr=new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:0});
var still=window.matchMedia("(prefers-reduced-motion:reduce)").matches,shown=0;
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function ptGJ(g){return g<6000?0:g<9000?80:g<12000?150:200}
function calc(){
  var ctc=Math.max(0,parseFloat($("ctc").value)||0),bp=+$("bp").value;
  var gross=Math.round(ctc/12),basic=Math.round(gross*bp/100),hra=Math.round(basic*.5),spl=gross-basic-hra;
  var base=$("cap").checked?Math.min(basic,15000):basic,pf=$("pf").checked?Math.round(base*.12):0,pt=$("pt").value==="gj"?ptGJ(gross):0;
  return{ctc:ctc,gross:gross,basic:basic,hra:hra,spl:spl,pf:pf,pt:pt,net:gross-pf-pt}}
function line(a,b,c){return'<div class="ln '+(c||"")+'"><span>'+a+'</span><i></i><span>'+b+'</span></div>'}
function count(to){
  var from=shown,t0=null;shown=to;
  if(still||from===to){$("net").textContent=inr.format(to);return}
  cancelAnimationFrame(count.r);
  (function step(t){if(!t0)t0=t;var k=Math.min(1,(t-t0)/450),e=1-Math.pow(1-k,3);
    $("net").textContent=inr.format(Math.round(from+(to-from)*e));if(k<1)count.r=requestAnimationFrame(step)})(performance.now())}
function draw(){
  var c=calc(),bad=c.ctc<=0,g=c.gross||1;
  $("e-ctc").textContent=bad?"Enter an annual CTC above ₹0.":"";
  $("ctcv").textContent=inr.format(c.ctc);$("bpv").textContent=$("bp").value+"%";
  count(c.net);
  $("of").textContent=bad?"":"That is ₹"+Math.round(c.net/g*100)+" of every ₹100 you earn, before income tax. PF and professional tax take the rest.";
  $("flow").innerHTML='<i style="width:'+c.net/g*100+'%;background:var(--ink)"></i><i style="width:'+c.pf/g*100+'%;background:repeating-linear-gradient(45deg,var(--ink) 0 2px,var(--bg) 2px 5px)"></i><i style="width:'+c.pt/g*100+'%;background:#fff"></i>';
  var mo=new Date().toLocaleDateString("en-IN",{month:"long",year:"numeric"});
  $("rc").innerHTML='<h2>Northwind Pvt. Ltd.</h2><p class="c">Payslip for '+mo+'</p><hr>'
   +'<div class="ln b"><span>'+(esc($("name").value.trim())||"Employee")+'</span></div>'
   +'<div class="ln"><span>Annual CTC</span><i></i><span>'+inr.format(c.ctc)+'</span></div><hr>'
   +line("Basic",inr.format(c.basic))+line("House rent",inr.format(c.hra))+line("Special allowance",inr.format(c.spl))+line("Gross pay",inr.format(c.gross),"b")+'<hr>'
   +line("Provident fund","- "+inr.format(c.pf))+line("Professional tax","- "+inr.format(c.pt))+'<hr>'
   +line("In hand",inr.format(c.net),"big")
   +'<p class="fine">An estimate. Income tax (TDS) and employer contributions are not included.</p>'}
["ctc","bp","pf","cap","pt","name"].forEach(function(i){$(i).oninput=function(){if(i==="ctc"){var v=Math.min(3000000,Math.max(150000,+$("ctc").value||150000));$("ctcr").value=v}draw()};$(i).onchange=draw});
$("ctcr").oninput=function(){$("ctc").value=this.value;draw()};
$("pr").onclick=function(){window.print()};
draw();
</script>
</body>
</html>
